# NGINX.CONF FOR DEPLOYMENT to https://earthquake.science.upd.edu.ph

server {
  listen 80;
  server_name earthquake.science.upd.edu.ph; # domain name (change this if you a different domain name)

  # Redirect all HTTP traffic to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }

  # Expose ACME http-01 challenges for certbot renewals
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}

server {
  listen 443 ssl;
  server_name earthquake.science.upd.edu.ph; # domain name

  # TLS cert/key mounted from the certbot-managed volume
  ssl_certificate /etc/nginx/ssl/live/earthquake.science.upd.edu.ph/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/earthquake.science.upd.edu.ph/privkey.pem;

  # Baseline hardening
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Tell crawlers to ignore backend endpoints
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /api/\nDisallow: /ringserver/\nDisallow: /fdsnws/\n";
  }

  # Block exposure of VCS and env files
  location ~* /(\.git|\.env|\.svn|\.hg)(/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
  }

  # Reject attempts to run or upload dynamic scripts
  location ~* \.(php|asp|aspx|cgi|pl|jsp|jspx|cfm)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
  }

  # Normalize base paths and block malformed prefixes
  location = /api { return 301 /api/; }
  location ~* ^/api[^/] { return 410; }
  location = /ringserver { return 301 /ringserver/; }
  location ~* ^/ringserver[^/] { return 410; }
  location = /fdsnws { return 301 /fdsnws/; }
  location ~* ^/fdsnws[^/] { return 410; }

  # Allow the SPA reset-password route to resolve directly
  location = /reset-password {
    proxy_pass http://ehub-frontend:3000;
  }

  # Cache immutable static assets served by the frontend container
  # Do not cache service worker or runtime config aggressively; stale copies can break app boot.
  location = /service-worker.js {
    proxy_pass http://ehub-frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /config.js {
    proxy_pass http://ehub-frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Cache immutable static assets served by the frontend container
  location ~* ^/(?!service-worker\.js$|config\.js$).+\.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    proxy_pass http://ehub-frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location / { # serve front-end react app
    # Drop suspicious SPA requests that look like probes or shortened slugs
    # Block query strings by default; allow push deep links like /?event=<publicID>.
    set $block_query 0;
    if ($args != "") { set $block_query 1; }
    if ($arg_event != "") { set $block_query 0; }
    if ($block_query = 1) { return 410; }
    if ($uri ~* "^/[a-z0-9]{1,6}$") { return 410; }
    if ($uri ~* "^/[a-z0-9_-]{20,}$") { return 410; }
    add_header Cache-Control "no-cache, must-revalidate";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://ehub-frontend:3000/;
  }

  location /api/ { # proxy to back-end nodejs app
    proxy_pass http://ehub-backend:5000/;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, max-age=0" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
  }

  # location /api/messaging/restricted { # restrict public access
  #     add_header X-Robots-Tag "noindex, nofollow" always;
  #     deny all;
  # }

  location /ringserver/ { # proxy http endpoint of RingServer
    proxy_pass http://ringserver:16000/;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, max-age=0" always;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /fdsnws/ { # proxy to fdsn webserver of seiscomp
    proxy_pass http://host.docker.internal:8080/fdsnws/;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, max-age=0" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  include /etc/nginx/ssl/options-ssl-nginx.conf;
  ssl_dhparam /etc/nginx/ssl/ssl-dhparams.pem;
}
