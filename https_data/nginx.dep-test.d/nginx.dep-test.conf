# NGINX.CONF FOR DEPLOYMENT TESTING
# This is similar to nginx.prod.conf but with:
#    1. server_name changed to the actual webapp domain name
#    2. the ssl certificates are changed to fullchain and privkey (as per certbot spec)
#    3. frontend and backend service names are different (see docker compose files)

server {
  listen 80;
  server_name ehub.local;

  location / {
    return 301 https://$host$request_uri;
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}

server {
  listen 443 ssl;
  server_name ehub.local;

  ssl_certificate /etc/nginx/ssl/live/ehub.local/ehub.local.pem;
  ssl_certificate_key /etc/nginx/ssl/live/ehub.local/ehub.local-key.pem;

  # Baseline hardening
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /api/\nDisallow: /ringserver/\nDisallow: /fdsnws/\n";
  }

  location ~* /(\.git|\.env|\.svn|\.hg)(/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
  }

  location ~* \.(php|asp|aspx|cgi|pl|jsp|jspx|cfm)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
  }

  location = /api { return 301 /api/; }
  location ~* ^/api[^/] { return 410; }
  location = /ringserver { return 301 /ringserver/; }
  location ~* ^/ringserver[^/] { return 410; }
  location = /fdsnws { return 301 /fdsnws/; }
  location ~* ^/fdsnws[^/] { return 410; }

  location = /reset-password {
    proxy_pass http://earthquake-hub-frontend-dep-test:3000;
  }

  # Do not cache service worker or runtime config aggressively; stale copies can break app boot.
  location = /service-worker.js {
    proxy_pass http://earthquake-hub-frontend-dep-test:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /config.js {
    proxy_pass http://earthquake-hub-frontend-dep-test:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Cache immutable static assets served by the frontend container
  location ~* ^/(?!service-worker\.js$|config\.js$).+\.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    proxy_pass http://earthquake-hub-frontend-dep-test:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location / { # serve front-end react app
    error_page 410 =410 @spa_not_found;
    # Block query strings by default; allow push deep links like /?event=<publicID>.
    set $block_query 0;
    if ($args != "") { set $block_query 1; }
    if ($arg_event != "") { set $block_query 0; }
    if ($block_query = 1) { return 410; }
    if ($uri ~* "^/[a-z0-9]{1,6}$") { return 410; }
    if ($uri ~* "^/[a-z0-9_-]{20,}$") { return 410; }
    add_header Cache-Control "no-cache, must-revalidate";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://earthquake-hub-frontend-dep-test:3000/;
  }

  location @spa_not_found {
    add_header Cache-Control "no-cache, must-revalidate";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://earthquake-hub-frontend-dep-test:3000/index.html;
  }

  location ^~ /api/ { # proxy to back-end nodejs app
    proxy_pass http://earthquake-hub-backend-dep-test:5000/;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, max-age=0" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
  }

  # Allow sender-originated alerts only on this exact endpoint.
  # Keep the broader restricted namespace blocked.
  location = /api/messaging/restricted/rshake-alert {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, max-age=0" always;
    limit_except POST { deny all; }
    proxy_pass http://earthquake-hub-backend-dep-test:5000/messaging/restricted/rshake-alert;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
  }

  location /api/messaging/restricted { # restrict public access
    add_header X-Robots-Tag "noindex, nofollow" always;
    deny all;
  }

  location ^~ /ringserver/ { # proxy http endpoint of RingServer
    proxy_pass http://ringserver-dep-test:16000/;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, max-age=0" always;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /fdsnws/ { # proxy to fdsn webserver of seiscomp
    proxy_pass http://host.docker.internal:8080/fdsnws/;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, max-age=0" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  include /etc/nginx/ssl/options-ssl-nginx.conf;
  ssl_dhparam /etc/nginx/ssl/ssl-dhparams.pem;
}
