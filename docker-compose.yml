# For actual deployment
# Requires valid domain name for certbot

services:
  nginx-proxy:
    container_name: nginx-proxy
    image: "nginx:stable"
    depends_on:
      - "ehub-backend"
      - "ehub-frontend"
    networks:
      app-network:
        ipv4_address: 172.21.0.8
    ports:  # expose nginx ports to host
      - "80:80"
      - "443:443"
    extra_hosts:
       - "host.docker.internal:host-gateway"
    volumes:
      - ./https_data/nginx.d:/etc/nginx/conf.d:ro              # Mount read-only access to nginx conf file.
                                                               # NOTE: Edit nginx.conf in this dir to reflect correct domain name of your server
      - ./https_data/certbot/www:/var/www/certbot:ro           # Certbot will write a token in this dir, served by nginx on well-known/acme-challenge/:80 route
      - ./https_data/certbot/conf:/etc/nginx/ssl:ro            # Certbot will write the certs into this (/etc/nginx/ssl), used by nginx as ssl_certificate and ssl_certificate_key under the directory /etc/nginx/ssl/live/<domain-name>/<fullchain-or-privkey>.pem;

  wstunnel-server:
    image: ghcr.io/erebe/wstunnel:${WSTUNNEL_SERVER_VERSION:-v10.5.2}
    container_name: wstunnel-server
    volumes:
      - ./wstunnel-restrictions.yaml:/home/app/wstunnel-restrictions.yaml:ro
    command:
      - /home/app/wstunnel
      - server
      - ws://0.0.0.0:7001
      - --log-lvl
      - INFO
      - --restrict-config
      - /home/app/wstunnel-restrictions.yaml
    restart: unless-stopped
    network_mode: host

  certbot:
    image: certbot/certbot
    volumes:
      - ./https_data/certbot/conf:/etc/letsencrypt:rw          # Run the following command to renew the certificates:
      - ./https_data/certbot/www:/var/www/certbot:rw           #   docker compose run --rm certbot renew

  upload-permissions:
    image: alpine:3.20
    command: sh -c "mkdir -p /uploads && chown -R 1000:1000 /uploads && chmod -R u+rwX,go+rX /uploads"
    volumes:
      - type: bind
        source: ${UPLOAD_HOST_DIR:-./backend-uploads}
        target: /uploads

  ehub-frontend:
    container_name: ehub-frontend
    environment: # load env vars from docker compose --env-file
      REACT_APP_PUBLIC_VAPID_KEY: ${REACT_APP_PUBLIC_VAPID_KEY}
      # If REACT_APP_BACKEND is unset, derive from PUBLIC_SITE_ORIGIN.
      # Example: PUBLIC_SITE_ORIGIN=https://ehub.local -> https://ehub.local/api
      REACT_APP_BACKEND: ${REACT_APP_BACKEND:-${PUBLIC_SITE_ORIGIN}/api}
      # If unset, use same site domain through nginx proxy.
      REACT_APP_FDSNWS: ${REACT_APP_FDSNWS:-https://${PUBLIC_SITE_HOST}/fdsnws}
      REACT_APP_RS_FDSNWS: ${REACT_APP_RS_FDSNWS}
      # If unset, use same site domain through nginx proxy.
      REACT_APP_RINGSERVER_WS: ${REACT_APP_RINGSERVER_WS:-wss://${PUBLIC_SITE_HOST}/ringserver/datalink}
      REACT_APP_PROD_HOSTS: ${REACT_APP_PROD_HOSTS:-${PUBLIC_SITE_HOST}}
      REACT_APP_REMOTE_ACTION_REQUIRE_TUNNEL: ${REACT_APP_REMOTE_ACTION_REQUIRE_TUNNEL:-}
      REACT_APP_DEFAULT_RINGSERVER_USERNAME: ${REACT_APP_DEFAULT_RINGSERVER_USERNAME:-}
      REACT_APP_SEIS_DEMO: ${REACT_APP_SEIS_DEMO:-}
      REACT_APP_SEIS_DEMO_URL: ${REACT_APP_SEIS_DEMO_URL:-}
      REACT_APP_VERSION: ${REACT_APP_VERSION:-}
      REACT_APP_GA_MEASUREMENT_ID: ${REACT_APP_GA_MEASUREMENT_ID}
    image: "ghcr.io/upri-earthquake/earthquake-hub-frontend:latest"
    depends_on:
      - "ehub-backend"
    expose:
      - "3000"
    extra_hosts:
       - "host.docker.internal:host-gateway"
    networks:
      app-network:
        ipv4_address: 172.21.0.2

  ehub-backend:
    container_name: ehub-backend
    environment:
      NODE_ENV: production
      MONGO_CONNX_TYPE: ${MONGO_CONNX_TYPE}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_NAME: ${MONGO_NAME}

      # webpush notifications VAPID keys
      PUBLIC_VAPID_KEY: ${PUBLIC_VAPID_KEY}
      PRIVATE_VAPID_KEY: ${PRIVATE_VAPID_KEY}
      WEB_PUSH_CONTACT: ${WEB_PUSH_CONTACT}
      NOTIF_CLEANUP_ENABLED: ${NOTIF_CLEANUP_ENABLED}
      NOTIF_CLEANUP_INTERVAL_MIN: ${NOTIF_CLEANUP_INTERVAL_MIN}
      NOTIF_STALE_DAYS: ${NOTIF_STALE_DAYS}
      NOTIF_FAILURE_THRESHOLD: ${NOTIF_FAILURE_THRESHOLD}
      NOTIF_INVALID_TTL_DAYS: ${NOTIF_INVALID_TTL_DAYS}

      # Granular reverse-geolocation
      GEOSERVE_HOST: ${GEOSERVE_HOST}
      GEOSERVE_PORT: ${GEOSERVE_PORT}
      TZ: ${TZ:-Asia/Manila}

      # earthquake event online-station and catalog enrichment jobs
      FDSNWS_DATASELECT_URL: ${FDSNWS_DATASELECT_URL}
      FDSNWS_NETWORK: ${FDSNWS_NETWORK}
      FDSNWS_LOCATION: ${FDSNWS_LOCATION}
      FDSNWS_CHANNEL: ${FDSNWS_CHANNEL}
      FDSNWS_WINDOW_SECONDS: ${FDSNWS_WINDOW_SECONDS}
      ONLINE_STATION_REFINEMENT_DELAY_MS: ${ONLINE_STATION_REFINEMENT_DELAY_MS}
      RECORDING_AVAILABILITY_GRACE_PERIOD_MS: ${RECORDING_AVAILABILITY_GRACE_PERIOD_MS:-1800000}
      RECORDING_AVAILABILITY_RETRY_DELAY_MS: ${RECORDING_AVAILABILITY_RETRY_DELAY_MS:-300000}
      RECORDING_AVAILABILITY_MAX_ATTEMPTS: ${RECORDING_AVAILABILITY_MAX_ATTEMPTS:-4}
      EVENT_SOURCE_CATALOG: ${EVENT_SOURCE_CATALOG:-upri-current}
      EVENT_SOURCE_SERVER: ${EVENT_SOURCE_SERVER:-earthquake.up.edu.ph}
      EVENT_SOURCE_SEISCOMP_VERSION: ${EVENT_SOURCE_SEISCOMP_VERSION:-}
      ENRICHMENT_CRON: ${ENRICHMENT_CRON}
      ENRICHMENT_MIN_AGE_HOURS: ${ENRICHMENT_MIN_AGE_HOURS}
      MAX_ENRICHMENT_ATTEMPTS: ${MAX_ENRICHMENT_ATTEMPTS}
      ENRICHMENT_BATCH_SIZE: ${ENRICHMENT_BATCH_SIZE}
      ENRICHMENT_RUN_ON_STARTUP: ${ENRICHMENT_RUN_ON_STARTUP}
      ENRICHMENT_STARTUP_DELAY_MS: ${ENRICHMENT_STARTUP_DELAY_MS}
      ENRICHMENT_LOCK_TTL_MS: ${ENRICHMENT_LOCK_TTL_MS}
      USGS_REQUEST_TIMEOUT_MS: ${USGS_REQUEST_TIMEOUT_MS}
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH}

      # production host domain (and for deployment testing)
      W3_CLIENT_PROD_HOST: ${W3_CLIENT_PROD_HOST}
      CLIENT_PROD_HOST: ${CLIENT_PROD_HOST}
      BACKEND_PROD_HOST: ${BACKEND_PROD_HOST}
      BACKEND_PROD_PORT: ${BACKEND_PROD_PORT}

      #ringserver host
      RINGSERVER_HOST: ${RINGSERVER_HOST}
      RINGSERVER_PORT: ${RINGSERVER_PORT}

      # jsonwebtoken keys
      ACCESS_TOKEN_PRIVATE_KEY_WEB: ${ACCESS_TOKEN_PRIVATE_KEY_WEB}
      REFRESH_TOKEN_PRIVATE_KEY_WEB: ${REFRESH_TOKEN_PRIVATE_KEY_WEB}
      JWT_WEB_EXPIRY: ${JWT_WEB_EXPIRY}
      REFRESH_TOKEN_WEB_EXPIRY: ${REFRESH_TOKEN_WEB_EXPIRY}
      ACCESS_TOKEN_PRIVATE_KEY_DEVICE: ${ACCESS_TOKEN_PRIVATE_KEY_DEVICE}
      ACCESS_TOKEN_PRIVATE_KEY_BRGY: ${ACCESS_TOKEN_PRIVATE_KEY_BRGY}
      REFRESH_TOKEN_PRIVATE_KEY_BRGY: ${REFRESH_TOKEN_PRIVATE_KEY_BRGY}
      PASSWORD_RESET_TOKEN_KEY: ${PASSWORD_RESET_TOKEN_KEY}
      PASSWORD_RESET_TOKEN_EXPIRY: ${PASSWORD_RESET_TOKEN_EXPIRY}
      ACCESS_TOKEN_PRIVATE_KEY: ${ACCESS_TOKEN_PRIVATE_KEY}
      JWT_EXPIRY: ${JWT_EXPIRY}
      JWT_DEVICE_EXPIRY: ${JWT_DEVICE_EXPIRY}
      JWT_BRGY_EXPIRY: ${JWT_BRGY_EXPIRY}
      # refresh token keys
      REFRESH_TOKEN_PRIVATE_KEY: ${REFRESH_TOKEN_PRIVATE_KEY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      REFRESH_TOKEN_DEVICE_EXPIRY: ${REFRESH_TOKEN_DEVICE_EXPIRY}
      REFRESH_TOKEN_BRGY_EXPIRY: ${REFRESH_TOKEN_BRGY_EXPIRY}

      # account identifiers and username policy
      USERNAME_MIN_LENGTH: ${USERNAME_MIN_LENGTH}
      USERNAME_MAX_LENGTH: ${USERNAME_MAX_LENGTH}
      USERNAME_ALLOWED_PATTERN: ${USERNAME_ALLOWED_PATTERN}
      COMMENTS_DEFAULT_STATUS: ${COMMENTS_DEFAULT_STATUS:-approved}
      REPORT_POST_RATE_LIMIT_WINDOW_MS: ${REPORT_POST_RATE_LIMIT_WINDOW_MS:-900000}
      REPORT_POST_RATE_LIMIT_MAX: ${REPORT_POST_RATE_LIMIT_MAX:-10}
      UPLOAD_DIR: ${UPLOAD_DIR}
      UPLOAD_PUBLIC_PATH: ${UPLOAD_PUBLIC_PATH:-/uploads}

      # email delivery
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-}
      EMAIL_LOGO_PATH: ${EMAIL_LOGO_PATH:-}
      EMAIL_LOGO_PUBLIC_FILE: ${EMAIL_LOGO_PUBLIC_FILE:-}
      EMAIL_FRONTEND_PUBLIC_DIR: ${EMAIL_FRONTEND_PUBLIC_DIR:-}
      # email alerts
      ALERT_EMAIL_ADMIN_TO: ${ALERT_EMAIL_ADMIN_TO}
      EMAIL_ALERT_ADMIN_TO: ${EMAIL_ALERT_ADMIN_TO}
      ALERT_EMAIL_THREAD_KEY: ${ALERT_EMAIL_THREAD_KEY}
      ALERT_EMAIL_THREAD_DOMAIN: ${ALERT_EMAIL_THREAD_DOMAIN}
      RSHAKE_ALERT_SHARED_SECRET: ${RSHAKE_ALERT_SHARED_SECRET}
      RSHAKE_ALERT_DEVICE_SECRET_BYTES: ${RSHAKE_ALERT_DEVICE_SECRET_BYTES:-}

      # tunnel service (bastion): enrollment + registry
      TUNNEL_REGISTER_SCRIPT: ${TUNNEL_REGISTER_SCRIPT}
      TUNNEL_REVOKE_SCRIPT: ${TUNNEL_REVOKE_SCRIPT}
      TUNNEL_RESOLVE_SCRIPT: ${TUNNEL_RESOLVE_SCRIPT}
      TUNNEL_SCRIPT_TIMEOUT_MS: ${TUNNEL_SCRIPT_TIMEOUT_MS}
      TUNNEL_REGISTRY_FILE: ${TUNNEL_REGISTRY_FILE}
      TUNNEL_BASTION_HOST: ${TUNNEL_BASTION_HOST}
      TUNNEL_BASTION_PORT: ${TUNNEL_BASTION_PORT}
      TUNNEL_PORT_RANGE_START: ${TUNNEL_PORT_RANGE_START}
      TUNNEL_PORT_RANGE_END: ${TUNNEL_PORT_RANGE_END}
      TUNNEL_BASTION_HOST_KEY: ${TUNNEL_BASTION_HOST_KEY}
      TUNNEL_WSS_URL: ${TUNNEL_WSS_URL}
      TUNNEL_WSS_PATH_PREFIX: ${TUNNEL_WSS_PATH_PREFIX}

      # tunnel service (bastion): register/revoke script SSH execution
      TUNNEL_SCRIPT_EXEC_MODE: ${TUNNEL_SCRIPT_EXEC_MODE}
      TUNNEL_SCRIPT_SSH_HOST: ${TUNNEL_SCRIPT_SSH_HOST}
      TUNNEL_SCRIPT_SSH_PORT: ${TUNNEL_SCRIPT_SSH_PORT}
      TUNNEL_SCRIPT_SSH_USER: ${TUNNEL_SCRIPT_SSH_USER}
      TUNNEL_SCRIPT_SSH_KEY_PATH: ${TUNNEL_SCRIPT_SSH_KEY_PATH}
      TUNNEL_SCRIPT_SSH_KNOWN_HOSTS_PATH: ${TUNNEL_SCRIPT_SSH_KNOWN_HOSTS_PATH}
      TUNNEL_SCRIPT_SSH_STRICT_HOST_KEY: ${TUNNEL_SCRIPT_SSH_STRICT_HOST_KEY}
      TUNNEL_SCRIPT_SSH_REMOTE_PREFIX: ${TUNNEL_SCRIPT_SSH_REMOTE_PREFIX}

      # remote action: relay/direct execution settings
      TUNNEL_REMOTE_ACTION_EXEC_MODE: ${TUNNEL_REMOTE_ACTION_EXEC_MODE}
      TUNNEL_REMOTE_ACTION_TARGET_SSH_HOST: ${TUNNEL_REMOTE_ACTION_TARGET_SSH_HOST}
      TUNNEL_REMOTE_ACTION_RELAY_SSH_REMOTE_PREFIX: ${TUNNEL_REMOTE_ACTION_RELAY_SSH_REMOTE_PREFIX}
      TUNNEL_REMOTE_ACTION_SSH_HOST: ${TUNNEL_REMOTE_ACTION_SSH_HOST}
      TUNNEL_REMOTE_ACTION_SSH_USER: ${TUNNEL_REMOTE_ACTION_SSH_USER}
      TUNNEL_REMOTE_ACTION_SSH_KEY_PATH: ${TUNNEL_REMOTE_ACTION_SSH_KEY_PATH}
      TUNNEL_REMOTE_ACTION_SSH_KNOWN_HOSTS_PATH: ${TUNNEL_REMOTE_ACTION_SSH_KNOWN_HOSTS_PATH}
      TUNNEL_REMOTE_ACTION_SSH_STRICT_HOST_KEY: ${TUNNEL_REMOTE_ACTION_SSH_STRICT_HOST_KEY}
      TUNNEL_REMOTE_ACTION_TIMEOUT_MS: ${TUNNEL_REMOTE_ACTION_TIMEOUT_MS}

      # optional enrollment fallbacks (when scripts do not emit keys)
      TUNNEL_REMOTE_ACTIONS_OPERATOR_PUBLIC_KEY: ${TUNNEL_REMOTE_ACTIONS_OPERATOR_PUBLIC_KEY}
      TUNNEL_OPERATOR_SSH_PUBLIC_KEY: ${TUNNEL_OPERATOR_SSH_PUBLIC_KEY}
    volumes:
      - type: bind
        source: ./bastion
        target: /opt/upri/bastion
        read_only: true
      - type: bind
        source: ${UPLOAD_HOST_DIR:-./backend-uploads}
        target: ${UPLOAD_DIR:-/app/public/uploads}
    depends_on:
      mongodb:
        condition: service_started
      upload-permissions:
        condition: service_completed_successfully
    image: "ghcr.io/upri-earthquake/earthquake-hub-backend:latest"
    expose:
      - "5000"
    extra_hosts:
       - "host.docker.internal:host-gateway"
    networks:
      app-network:
        ipv4_address: 172.21.0.3

  ringserver:
    container_name: ringserver
    image: "ghcr.io/upri-earthquake/receiver-ringserver:latest"
    expose:
      - "16000"
    networks:
      app-network:
        ipv4_address: 172.21.0.4
    ports:
      - "16000:16000" # make host's 16000 connect to RS's 16000
    volumes:
      - type: bind
        source: ./ringserver-configs
        target: /app/host-configs
    user: root
    entrypoint: /app/host-configs/entrypoint.sh

  mongodb:
    container_name: mongodb
    image: "mongo:5.0"
    volumes:
      - type: volume
        source: earthquake-hub-mongodb-data
        target: /data/db
    expose:
      - "27017"
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      app-network:
        ipv4_address: 172.21.0.5

# TODO: Add admin-frontend
# TODO: Add admin-backend

# Geoserve is used to convert (long, lat) to city-names.
# The images are available as bare-metal builds in the server

  geoserve-db:
    build:
      context: ../hazdev-geoserve-ws
      dockerfile: Dockerfile-db
    image: "usgs/hazdev-geoserve-db:latest"
    environment:
      - DATALOAD_DIR=${DATALOAD_DIR}
      - DB_ADMIN_USER=${DB_ADMIN_USER}
      - DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD}
      - DB_LOAD_TYPE=${DB_LOAD_TYPE}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_SCHEMA=${DB_SCHEMA}
      - DB_ADMIN_DSN=${DB_ADMIN_DSN}
      - PGDATA=${PGDATA}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # volume to store downloaded data files
      - ../hazdev-geoserve-ws/data/dataload:/tmp/dataload
      # volume to store database data files
      - ../hazdev-geoserve-ws/data/pgdata:/var/lib/postgresqsl/data/pgdata
    networks:
      app-network:
        ipv4_address: 172.21.0.6

  geoserve-ws:
    build:
      context: ../hazdev-geoserve-ws
      dockerfile: Dockerfile-ws
    image: "usgs/hazdev-geoserve-ws:latest"
    environment:
      - DB_DSN=${DB_DSN}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_SCHEMA=${DB_SCHEMA}
    volumes:
      # volumes for local dev
      - ../hazdev-geoserve-ws/src/htdocs:/var/www/apps/hazdev-geoserve-ws/htdocs
      - ../hazdev-geoserve-ws/src/lib:/var/www/apps/hazdev-geoserve-ws/lib
    expose:
      - "80"
    networks:
      app-network:
        ipv4_address: 172.21.0.7

volumes:
  earthquake-hub-mongodb-data:
    external: true # same volume used by other containers
    name: earthquake-hub-mongodb-data

networks:
  app-network:
    name: earthquake-hub-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
